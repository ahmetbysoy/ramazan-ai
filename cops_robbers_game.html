<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Hırsız Polis Kovalamacası - RAMAZAN AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body {
      background: #020617;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 440px;
      height: 100vh;
      height: 100dvh;
      background: #0b0f19;
      box-shadow: 0 0 35px rgba(0,0,0,0.9);
      overflow: hidden;
    }
    #gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    /* Top HUD */
    .top-hud {
      position: absolute;
      top: 0.8rem;
      left: 0.8rem;
      right: 0.8rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      pointer-events: none;
    }
    .hud-chip {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(8px);
      padding: 0.4rem 0.75rem;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      font-size: 0.85rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }
    .wanted-stars {
      color: #f59e0b;
      letter-spacing: 2px;
    }
    /* Mobile D-Pad & Action Buttons */
    .mobile-controls {
      position: absolute;
      bottom: 1.2rem;
      left: 1rem;
      right: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      z-index: 10;
      pointer-events: none;
    }
    .dpad {
      pointer-events: auto;
      display: grid;
      grid-template-columns: repeat(3, 52px);
      grid-template-rows: repeat(3, 52px);
      gap: 4px;
    }
    .d-btn {
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(6px);
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      border-radius: 12px;
      color: #fff;
      font-size: 1.25rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .d-btn:active {
      background: rgba(59, 130, 246, 0.6);
      transform: scale(0.92);
    }
    .boost-btn {
      pointer-events: auto;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      border: 2px solid rgba(255, 255, 255, 0.4);
      color: #fff;
      font-size: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 18px rgba(245, 158, 11, 0.5);
    }
    .boost-btn:active {
      transform: scale(0.92);
      filter: brightness(1.2);
    }
    /* Modal Screen */
    .screen-modal {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(11, 15, 25, 0.92);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.1rem;
      padding: 2rem;
      text-align: center;
      z-index: 20;
    }
    .screen-modal h1 {
      font-size: 2.1rem;
      font-weight: 900;
      color: #ef4444;
      text-shadow: 0 0 20px rgba(239, 68, 68, 0.5);
    }
    .start-btn {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      border: none;
      color: #fff;
      padding: 0.85rem 2.4rem;
      border-radius: 30px;
      font-size: 1.15rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(239, 68, 68, 0.6);
    }
    .start-btn:active { transform: scale(0.95); }
  </style>
</head>
<body>

  <div id="game-container">
    <!-- Top HUD -->
    <div class="top-hud">
      <div class="hud-chip">💰 <span id="scoreText">0</span></div>
      <div class="hud-chip"><span class="wanted-stars" id="starsText">★☆☆☆☆</span></div>
      <div class="hud-chip" id="livesText">❤️❤️❤️</div>
    </div>

    <!-- Main Canvas -->
    <canvas id="gameCanvas"></canvas>

    <!-- Controls for Mobile Touch -->
    <div class="mobile-controls">
      <div class="dpad">
        <div></div>
        <div class="d-btn" id="btnUp">▲</div>
        <div></div>
        <div class="d-btn" id="btnLeft">◀</div>
        <div></div>
        <div class="d-btn" id="btnRight">▶</div>
        <div></div>
        <div class="d-btn" id="btnDown">▼</div>
        <div></div>
      </div>

      <div class="boost-btn" id="btnBoost">
        <span>⚡</span>
        <span style="font-size: 0.65rem; font-weight: 800;">HIZ</span>
      </div>
    </div>

    <!-- Start / End Screen -->
    <div class="screen-modal" id="gameModal">
      <div style="font-size: 4rem;">🚨 🏃💨 🚓</div>
      <h1 id="modalTitle">HIRSIZ POLİS</h1>
      <p id="modalDesc" style="color: #cbd5e1; font-size: 0.95rem; line-height: 1.45;">
        Paraları topla, peşindeki polis arabalarından kaç!<br>
        Sıkıştığında ⚡ HIZ butonuna basarak hızlan.
      </p>
      <button class="start-btn" id="modalBtn" onclick="startGame()">KAÇIŞI BAŞLAT</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('game-container');

    let W, H;
    function resize() {
      W = container.clientWidth;
      H = container.clientHeight;
      canvas.width = W;
      canvas.height = H;
    }
    window.addEventListener('resize', resize);
    resize();

    // Sound synthesizer using Web Audio API (Zero external audio files)
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    function playBeep(freq, duration, type="sine") {
      try {
        if (!audioCtx) audioCtx = new AudioCtx();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    // Game Variables
    let gameState = "MENU"; // MENU, PLAYING, GAMEOVER
    let score = 0;
    let lives = 3;
    let wantedStars = 1;
    let boostAvailable = 100;
    let isBoosting = false;
    let highScore = localStorage.getItem('cops_high_score') || 0;

    // Player (The Robber)
    const player = {
      x: W / 2,
      y: H / 2,
      size: 26,
      baseSpeed: 3.8,
      speed: 3.8,
      dirX: 0,
      dirY: 0
    };

    // Police Cars
    let cops = [];
    const copColors = ['#3b82f6', '#ef4444']; // Red & Blue sirens

    // Money bags
    let lootBags = [];

    function spawnLoot() {
      lootBags.push({
        x: 30 + Math.random() * (W - 60),
        y: 40 + Math.random() * (H - 220),
        value: 100,
        radius: 12
      });
    }

    function spawnCop() {
      const edge = Math.floor(Math.random() * 4);
      let cx = 0, cy = 0;
      if (edge === 0) { cx = Math.random() * W; cy = 20; }
      else if (edge === 1) { cx = W - 20; cy = Math.random() * H; }
      else if (edge === 2) { cx = Math.random() * W; cy = H - 180; }
      else { cx = 20; cy = Math.random() * H; }

      cops.push({
        x: cx,
        y: cy,
        size: 28,
        speed: 2.1 + (wantedStars * 0.35),
        sirenFlash: 0
      });
    }

    // Controls
    const keys = { up: false, down: false, left: false, right: false, boost: false };

    window.addEventListener('keydown', e => {
      if (e.code === 'ArrowUp' || e.code === 'KeyW') keys.up = true;
      if (e.code === 'ArrowDown' || e.code === 'KeyS') keys.down = true;
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
      if (e.code === 'Space') keys.boost = true;
    });
    window.addEventListener('keyup', e => {
      if (e.code === 'ArrowUp' || e.code === 'KeyW') keys.up = false;
      if (e.code === 'ArrowDown' || e.code === 'KeyS') keys.down = false;
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
      if (e.code === 'Space') keys.boost = false;
    });

    // Touch D-Pad Controls
    function bindTouch(id, key) {
      const el = document.getElementById(id);
      el.addEventListener('touchstart', e => { e.preventDefault(); keys[key] = true; });
      el.addEventListener('touchend', e => { e.preventDefault(); keys[key] = false; });
    }
    bindTouch('btnUp', 'up');
    bindTouch('btnDown', 'down');
    bindTouch('btnLeft', 'left');
    bindTouch('btnRight', 'right');
    bindTouch('btnBoost', 'boost');

    function startGame() {
      document.getElementById('gameModal').style.display = 'none';
      score = 0;
      lives = 3;
      wantedStars = 1;
      boostAvailable = 100;
      player.x = W / 2;
      player.y = H / 2;
      cops = [];
      lootBags = [];

      for (let i = 0; i < 4; i++) spawnLoot();
      spawnCop();
      spawnCop();

      updateHUD();
      gameState = "PLAYING";
      playBeep(440, 0.15, "triangle");
    }

    function updateHUD() {
      document.getElementById('scoreText').innerText = score;
      let stars = "";
      for (let i = 1; i <= 5; i++) stars += (i <= wantedStars ? "★" : "☆");
      document.getElementById('starsText').innerText = stars;
      let hearts = "";
      for (let i = 0; i < lives; i++) hearts += "❤️";
      document.getElementById('livesText').innerText = hearts;
    }

    function gameOver() {
      gameState = "GAMEOVER";
      playBeep(180, 0.5, "sawtooth");
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('cops_high_score', highScore);
      }
      document.getElementById('modalTitle').innerText = "YAKALANDIN!";
      document.getElementById('modalDesc').innerHTML = `Polisler seni kuşattı! 🚨<br><strong>Toplanan Ganimet: $${score}</strong><br>En Yüksek Skor: $${highScore}`;
      document.getElementById('modalBtn').innerText = "TEKRAR KAÇ";
      document.getElementById('gameModal').style.display = 'flex';
    }

    // Game Update Loop
    function update() {
      if (gameState !== "PLAYING") return;

      // Boost calculation
      isBoosting = keys.boost && boostAvailable > 5;
      if (isBoosting) {
        player.speed = player.baseSpeed * 1.65;
        boostAvailable = Math.max(0, boostAvailable - 1.2);
      } else {
        player.speed = player.baseSpeed;
        boostAvailable = Math.min(100, boostAvailable + 0.35);
      }

      // Player Movement
      let dx = 0, dy = 0;
      if (keys.up) dy -= 1;
      if (keys.down) dy += 1;
      if (keys.left) dx -= 1;
      if (keys.right) dx += 1;

      // Normalize diagonal
      if (dx !== 0 && dy !== 0) {
        dx *= 0.7071;
        dy *= 0.7071;
      }

      player.x += dx * player.speed;
      player.y += dy * player.speed;

      // Bounds check
      const boundBottom = H - 180;
      player.x = Math.max(16, Math.min(W - 16, player.x));
      player.y = Math.max(45, Math.min(boundBottom, player.y));

      // Loot Collection
      lootBags.forEach((loot, idx) => {
        const dist = Math.hypot(player.x - loot.x, player.y - loot.y);
        if (dist < player.size / 2 + loot.radius) {
          score += loot.value;
          playBeep(880, 0.1, "sine");
          lootBags.splice(idx, 1);
          spawnLoot();

          // Increase Wanted level every $400
          const newStars = Math.min(5, Math.floor(score / 400) + 1);
          if (newStars > wantedStars) {
            wantedStars = newStars;
            spawnCop();
            playBeep(650, 0.3, "square");
          }
          updateHUD();
        }
      });

      // Police Movement and AI Chasing
      cops.forEach(cop => {
        const angle = Math.atan2(player.y - cop.y, player.x - cop.x);
        cop.x += Math.cos(angle) * cop.speed;
        cop.y += Math.sin(angle) * cop.speed;
        cop.sirenFlash += 0.2;

        // Collision with player
        const distToPlayer = Math.hypot(player.x - cop.x, player.y - cop.y);
        if (distToPlayer < (player.size / 2 + cop.size / 2) - 4) {
          lives -= 1;
          playBeep(220, 0.3, "sawtooth");
          updateHUD();

          // Reposition cop after hit
          cop.x = Math.random() < 0.5 ? 20 : W - 20;
          cop.y = 30;

          if (lives <= 0) {
            gameOver();
          }
        }
      });
    }

    // Render Canvas
    function render() {
      ctx.clearRect(0, 0, W, H);

      // Grid City Streets
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 1;
      for (let x = 0; x < W; x += 40) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
      }
      for (let y = 0; y < H; y += 40) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
      }

      // Boundary Barricade
      ctx.strokeStyle = '#ef4444';
      ctx.lineWidth = 2;
      ctx.setLineDash([8, 8]);
      ctx.beginPath();
      ctx.moveTo(0, H - 175);
      ctx.lineTo(W, H - 175);
      ctx.stroke();
      ctx.setLineDash([]);

      // Draw Loot Bags
      lootBags.forEach(loot => {
        ctx.font = "20px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("💰", loot.x, loot.y);
      });

      // Draw Police Cars
      cops.forEach(cop => {
        ctx.save();
        ctx.translate(cop.x, cop.y);

        // Police Siren Light
        const sirenColor = Math.sin(cop.sirenFlash) > 0 ? '#ef4444' : '#3b82f6';
        ctx.fillStyle = sirenColor;
        ctx.beginPath();
        ctx.arc(0, -14, 6, 0, Math.PI * 2);
        ctx.fill();

        // Car Body
        ctx.font = "28px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("🚓", 0, 0);
        ctx.restore();
      });

      // Draw Player (Robber)
      ctx.save();
      ctx.translate(player.x, player.y);
      if (isBoosting) {
        // Boost flame / smoke trail
        ctx.font = "20px sans-serif";
        ctx.fillText("💨", -18, 12);
      }
      ctx.font = "30px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("🦹", 0, 0);
      ctx.restore();
    }

    function loop() {
      update();
      render();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
