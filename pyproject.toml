[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ramazan-ai"
version = "0.1.0"
description = "Multi-Agent Autonomous Software Engineering Orchestrator"
readme = "README.md"
authors = [{ name = "RAMAZAN AI Team" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.10.0",
    "typer>=0.15.0",
    "rich>=13.9.0",
    "litellm>=1.50.0",
    "gitpython>=3.1.40",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pyyaml>=6.0.2",
    "jsonschema>=4.23.0",
    "networkx>=3.4.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
ramazan = "ramazan.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
