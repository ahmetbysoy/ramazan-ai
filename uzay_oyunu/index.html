<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Uzay Savaşı - RAMAZAN AI Autonomous Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
    }
    #gameCanvas {
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none;
    }
    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
    }
    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-shadow: 0 0 10px rgba(0, 255, 255, 0.8);
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 1px;
    }
    .hud-stat {
      background: rgba(10, 20, 35, 0.65);
      border: 1px solid rgba(0, 255, 255, 0.3);
      padding: 8px 16px;
      border-radius: 8px;
      backdrop-filter: blur(4px);
    }
    .hud-stat span {
      color: #00ffff;
      font-size: 1.3rem;
    }
    /* Mobile Touch Controls */
    .touch-controls {
      display: none;
      pointer-events: auto;
      width: 100%;
      justify-content: space-between;
      align-items: flex-end;
      padding-bottom: 20px;
    }
    @media (pointer: coarse), (max-width: 900px) {
      .touch-controls {
        display: flex;
      }
    }
    .dpad-cluster {
      display: grid;
      grid-template-columns: repeat(3, 56px);
      grid-template-rows: repeat(2, 56px);
      gap: 8px;
    }
    .ctrl-btn {
      width: 56px;
      height: 56px;
      background: rgba(0, 220, 255, 0.15);
      border: 2px solid rgba(0, 220, 255, 0.4);
      border-radius: 50%;
      color: #00f0ff;
      font-size: 20px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
      box-shadow: 0 0 12px rgba(0, 220, 255, 0.2);
    }
    .ctrl-btn:active, .ctrl-btn.active {
      background: rgba(0, 220, 255, 0.45);
      transform: scale(0.94);
    }
    .action-cluster {
      display: flex;
      gap: 16px;
    }
    .fire-btn {
      width: 72px;
      height: 72px;
      background: rgba(255, 50, 80, 0.25);
      border: 2px solid rgba(255, 50, 80, 0.6);
      border-radius: 50%;
      color: #ff3366;
      font-size: 24px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
      box-shadow: 0 0 16px rgba(255, 50, 80, 0.35);
    }
    .fire-btn:active, .fire-btn.active {
      background: rgba(255, 50, 80, 0.6);
      transform: scale(0.92);
    }
    /* Modal / Menu Screens */
    .modal-screen {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(8, 14, 26, 0.92);
      border: 2px solid #00f0ff;
      border-radius: 16px;
      padding: 32px;
      text-align: center;
      pointer-events: auto;
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.35);
      backdrop-filter: blur(8px);
      max-width: 90%;
      width: 380px;
    }
    .modal-screen h1 {
      font-size: 2.2rem;
      margin-bottom: 12px;
      color: #00ffff;
      text-shadow: 0 0 15px #00ffff;
      letter-spacing: 2px;
    }
    .modal-screen p {
      font-size: 1rem;
      color: #a0c0df;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .btn-start {
      background: linear-gradient(135deg, #00d2ff 0%, #0066ff 100%);
      border: none;
      color: #fff;
      font-size: 1.2rem;
      font-weight: 700;
      padding: 14px 32px;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0, 210, 255, 0.5);
      transition: all 0.2s;
    }
    .btn-start:hover {
      transform: scale(1.05);
      box-shadow: 0 0 30px rgba(0, 210, 255, 0.8);
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <canvas id="gameCanvas"></canvas>

  <div id="ui-overlay">
    <!-- Top HUD -->
    <div class="hud-top">
      <div class="hud-stat">SKOR: <span id="scoreVal">0</span></div>
      <div class="hud-stat">CAN: <span id="livesVal">❤️❤️❤️</span></div>
      <div class="hud-stat">EN İYİ: <span id="highScoreVal">0</span></div>
    </div>

    <!-- Mobile Touch Controls -->
    <div class="touch-controls">
      <div class="dpad-cluster">
        <div></div>
        <div class="ctrl-btn" id="btnUp">▲</div>
        <div></div>
        <div class="ctrl-btn" id="btnLeft">◄</div>
        <div></div>
        <div class="ctrl-btn" id="btnRight">►</div>
      </div>
      <div class="action-cluster">
        <div class="fire-btn" id="btnFire">🔥</div>
      </div>
    </div>
  </div>

  <!-- Start Menu -->
  <div id="startScreen" class="modal-screen">
    <h1>UZAY SAVAŞI</h1>
    <p>RAMAZAN AI Autonomous Engine ile canlı üretildi.<br><br>
    Asteroidleri vurarak yok et ve uzay gemini koru!<br><br>
    🎮 <b>Masaüstü:</b> Yön Tuşları / WASD + Boşluk (Ateş)<br>
    📱 <b>Mobil:</b> Ekran dokunmatik butonları
    </p>
    <button class="btn-start" id="btnStartGame">OYNA</button>
  </div>

  <!-- Game Over Menu -->
  <div id="gameOverScreen" class="modal-screen hidden">
    <h1 style="color: #ff3366; text-shadow: 0 0 15px #ff3366;">GÖREV BAŞARISIZ</h1>
    <p>Asteroid gemine çarptı!<br><br>
    Skorun: <span id="finalScore" style="font-size: 1.5rem; color: #00ffff; font-weight: bold;">0</span><br>
    Rekor: <span id="finalHighScore" style="font-size: 1.2rem; color: #ffeb3b; font-weight: bold;">0</span>
    </p>
    <button class="btn-start" id="btnRestartGame">TEKRAR DENE</button>
  </div>

  <script>
    // --- WEB AUDIO API SYNTHESIZER ---
    class SoundEngine {
      constructor() {
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playLaser() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(880, now);
        osc.frequency.exponentialRampToValueAtTime(110, now + 0.15);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.15);
      }
      playExplosion() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const bufferSize = this.ctx.sampleRate * 0.3;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(600, now);
        filter.frequency.linearRampToValueAtTime(80, now + 0.3);
        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.5, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start(now);
      }
      playThrust() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(70, now);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.08);
      }
    }

    const sound = new SoundEngine();

    // --- GAME ENGINE ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Input States
    const keys = {
      ArrowUp: false,
      ArrowLeft: false,
      ArrowRight: false,
      KeyW: false,
      KeyA: false,
      KeyD: false,
      Space: false
    };

    window.addEventListener('keydown', (e) => {
      if (keys.hasOwnProperty(e.code)) keys[e.code] = true;
      if (e.code === 'Space' && !e.repeat && isPlaying) fireLaser();
    });
    window.addEventListener('keyup', (e) => {
      if (keys.hasOwnProperty(e.code)) keys[e.code] = false;
    });

    // Touch setup
    function bindTouch(id, code) {
      const el = document.getElementById(id);
      const setTrue = (e) => { e.preventDefault(); keys[code] = true; el.classList.add('active'); };
      const setFalse = (e) => { e.preventDefault(); keys[code] = false; el.classList.remove('active'); };
      el.addEventListener('touchstart', setTrue);
      el.addEventListener('touchend', setFalse);
      el.addEventListener('mousedown', setTrue);
      el.addEventListener('mouseup', setFalse);
    }
    bindTouch('btnUp', 'ArrowUp');
    bindTouch('btnLeft', 'ArrowLeft');
    bindTouch('btnRight', 'ArrowRight');

    const fireBtn = document.getElementById('btnFire');
    const onFire = (e) => {
      e.preventDefault();
      fireBtn.classList.add('active');
      if (isPlaying) fireLaser();
    };
    const offFire = (e) => {
      e.preventDefault();
      fireBtn.classList.remove('active');
    };
    fireBtn.addEventListener('touchstart', onFire);
    fireBtn.addEventListener('touchend', offFire);
    fireBtn.addEventListener('mousedown', onFire);
    fireBtn.addEventListener('mouseup', offFire);

    // Game Objects
    let ship = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      vx: 0,
      vy: 0,
      angle: -Math.PI / 2,
      rotationSpeed: 3.8,
      thrust: 320,
      radius: 18
    };

    let lasers = [];
    let asteroids = [];
    let particles = [];
    let stars = [];

    let score = 0;
    let lives = 3;
    let highScore = parseInt(localStorage.getItem('ramazan_space_high') || '0', 10);
    document.getElementById('highScoreVal').innerText = highScore;

    let isPlaying = false;

    // Starfield Background
    for (let i = 0; i < 90; i++) {
      stars.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        size: Math.random() * 2 + 0.5,
        alpha: Math.random() * 0.8 + 0.2
      });
    }

    function spawnAsteroids(count = 5) {
      for (let i = 0; i < count; i++) {
        let x, y, dist;
        do {
          x = Math.random() * canvas.width;
          y = Math.random() * canvas.height;
          dist = Math.hypot(x - ship.x, y - ship.y);
        } while (dist < 180);

        const angle = Math.random() * Math.PI * 2;
        const speed = 40 + Math.random() * 60;
        asteroids.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          radius: 36,
          tier: 3
        });
      }
    }

    function fireLaser() {
      sound.playLaser();
      const speed = 650;
      lasers.push({
        x: ship.x + Math.cos(ship.angle) * ship.radius,
        y: ship.y + Math.sin(ship.angle) * ship.radius,
        vx: Math.cos(ship.angle) * speed,
        vy: Math.sin(ship.angle) * speed,
        life: 1.2
      });
    }

    function createExplosion(x, y, color = '#ff8800', count = 18) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 160 + 20;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 0.5 + Math.random() * 0.4,
          maxLife: 0.9,
          color
        });
      }
    }

    let lastTime = performance.now();

    function gameLoop(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.1);
      lastTime = now;

      if (isPlaying) {
        update(dt);
      }
      render();
      requestAnimationFrame(gameLoop);
    }

    function update(dt) {
      // Rotation
      if (keys.ArrowLeft || keys.KeyA) {
        ship.angle -= ship.rotationSpeed * dt;
      }
      if (keys.ArrowRight || keys.KeyD) {
        ship.angle += ship.rotationSpeed * dt;
      }

      // Thrust
      if (keys.ArrowUp || keys.KeyW) {
        ship.vx += Math.cos(ship.angle) * ship.thrust * dt;
        ship.vy += Math.sin(ship.angle) * ship.thrust * dt;
        sound.playThrust();

        // Engine exhaust particle
        particles.push({
          x: ship.x - Math.cos(ship.angle) * (ship.radius + 4),
          y: ship.y - Math.sin(ship.angle) * (ship.radius + 4),
          vx: -Math.cos(ship.angle) * 80 + (Math.random() - 0.5) * 40,
          vy: -Math.sin(ship.angle) * 80 + (Math.random() - 0.5) * 40,
          life: 0.25,
          maxLife: 0.25,
          color: '#00f0ff'
        });
      }

      // Friction
      ship.vx *= 0.985;
      ship.vy *= 0.985;
      ship.x += ship.vx * dt;
      ship.y += ship.vy * dt;

      // Screen Wrap Ship
      if (ship.x < 0) ship.x = canvas.width;
      if (ship.x > canvas.width) ship.x = 0;
      if (ship.y < 0) ship.y = canvas.height;
      if (ship.y > canvas.height) ship.y = 0;

      // Update Lasers
      for (let i = lasers.length - 1; i >= 0; i--) {
        const l = lasers[i];
        l.x += l.vx * dt;
        l.y += l.vy * dt;
        l.life -= dt;
        if (l.life <= 0 || l.x < 0 || l.x > canvas.width || l.y < 0 || l.y > canvas.height) {
          lasers.splice(i, 1);
        }
      }

      // Update Asteroids
      for (let ast of asteroids) {
        ast.x += ast.vx * dt;
        ast.y += ast.vy * dt;
        if (ast.x < -ast.radius) ast.x = canvas.width + ast.radius;
        if (ast.x > canvas.width + ast.radius) ast.x = -ast.radius;
        if (ast.y < -ast.radius) ast.y = canvas.height + ast.radius;
        if (ast.y > canvas.height + ast.radius) ast.y = -ast.radius;
      }

      // Update Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt;
        if (p.life <= 0) {
          particles.splice(i, 1);
        }
      }

      // Collisions: Laser vs Asteroid
      for (let li = lasers.length - 1; li >= 0; li--) {
        const l = lasers[li];
        for (let ai = asteroids.length - 1; ai >= 0; ai--) {
          const ast = asteroids[ai];
          const dist = Math.hypot(l.x - ast.x, l.y - ast.y);
          if (dist < ast.radius) {
            sound.playExplosion();
            createExplosion(ast.x, ast.y, ast.tier === 3 ? '#ffaa00' : '#00ffff', 16);
            lasers.splice(li, 1);

            score += (4 - ast.tier) * 100;
            document.getElementById('scoreVal').innerText = score;

            // Split asteroid
            if (ast.tier > 1) {
              for (let k = 0; k < 2; k++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 70 + Math.random() * 70;
                asteroids.push({
                  x: ast.x,
                  y: ast.y,
                  vx: Math.cos(angle) * speed,
                  vy: Math.sin(angle) * speed,
                  radius: ast.radius * 0.6,
                  tier: ast.tier - 1
                });
              }
            }
            asteroids.splice(ai, 1);

            if (asteroids.length === 0) {
              spawnAsteroids(6);
            }
            break;
          }
        }
      }

      // Collisions: Ship vs Asteroid
      for (let ast of asteroids) {
        const dist = Math.hypot(ship.x - ast.x, ship.y - ast.y);
        if (dist < ship.radius + ast.radius) {
          sound.playExplosion();
          createExplosion(ship.x, ship.y, '#ff3366', 30);
          lives--;
          updateLivesUI();

          if (lives <= 0) {
            endGame();
            return;
          } else {
            // Reset position safely
            ship.x = canvas.width / 2;
            ship.y = canvas.height / 2;
            ship.vx = 0;
            ship.vy = 0;
          }
        }
      }
    }

    function updateLivesUI() {
      let str = '';
      for (let i = 0; i < lives; i++) str += '❤️';
      document.getElementById('livesVal').innerText = str || '💀';
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Starfield
      for (let s of stars) {
        ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha})`;
        ctx.fillRect(s.x, s.y, s.size, s.size);
      }

      // Draw Particles
      for (let p of particles) {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
        ctx.beginPath();
        ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1.0;

      // Draw Lasers
      ctx.strokeStyle = '#ff3366';
      ctx.shadowColor = '#ff3366';
      ctx.shadowBlur = 10;
      ctx.lineWidth = 3;
      for (let l of lasers) {
        ctx.beginPath();
        ctx.moveTo(l.x, l.y);
        ctx.lineTo(l.x - l.vx * 0.03, l.y - l.vy * 0.03);
        ctx.stroke();
      }
      ctx.shadowBlur = 0;

      // Draw Asteroids
      ctx.strokeStyle = '#00f0ff';
      ctx.shadowColor = '#00f0ff';
      ctx.shadowBlur = 8;
      ctx.lineWidth = 2.2;
      for (let ast of asteroids) {
        ctx.beginPath();
        ctx.arc(ast.x, ast.y, ast.radius, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(10, 25, 45, 0.7)';
        ctx.fill();
        ctx.stroke();
      }
      ctx.shadowBlur = 0;

      // Draw Spaceship
      if (lives > 0) {
        ctx.save();
        ctx.translate(ship.x, ship.y);
        ctx.rotate(ship.angle);

        ctx.strokeStyle = '#00ffff';
        ctx.fillStyle = '#081c33';
        ctx.shadowColor = '#00ffff';
        ctx.shadowBlur = 12;
        ctx.lineWidth = 2.5;

        ctx.beginPath();
        ctx.moveTo(ship.radius, 0);
        ctx.lineTo(-ship.radius * 0.7, ship.radius * 0.7);
        ctx.lineTo(-ship.radius * 0.4, 0);
        ctx.lineTo(-ship.radius * 0.7, -ship.radius * 0.7);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.restore();
      }
    }

    function startGame() {
      sound.init();
      score = 0;
      lives = 3;
      lasers = [];
      asteroids = [];
      particles = [];
      ship.x = canvas.width / 2;
      ship.y = canvas.height / 2;
      ship.vx = 0;
      ship.vy = 0;
      ship.angle = -Math.PI / 2;

      document.getElementById('scoreVal').innerText = '0';
      updateLivesUI();
      spawnAsteroids(5);

      document.getElementById('startScreen').classList.add('hidden');
      document.getElementById('gameOverScreen').classList.add('hidden');
      isPlaying = true;
    }

    function endGame() {
      isPlaying = false;
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('ramazan_space_high', highScore.toString());
        document.getElementById('highScoreVal').innerText = highScore;
      }
      document.getElementById('finalScore').innerText = score;
      document.getElementById('finalHighScore').innerText = highScore;
      document.getElementById('gameOverScreen').classList.remove('hidden');
    }

    document.getElementById('btnStartGame').addEventListener('click', startGame);
    document.getElementById('btnRestartGame').addEventListener('click', startGame);

    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
