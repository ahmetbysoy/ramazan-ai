<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Zıplayan Maymun (Jumping Monkey) - RAMAZAN AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body {
      background: #0f172a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
    }
    #game-wrapper {
      position: relative;
      width: 100%;
      max-width: 440px;
      height: 100vh;
      height: 100dvh;
      background: linear-gradient(180deg, #1e3a5f 0%, #14532d 100%);
      box-shadow: 0 0 30px rgba(0,0,0,0.8);
      overflow: hidden;
    }
    #gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    /* Touch Controls Overlay */
    .touch-controls {
      position: absolute;
      bottom: 1.5rem;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      padding: 0 1.5rem;
      pointer-events: none;
      z-index: 10;
    }
    .touch-btn {
      pointer-events: auto;
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(8px);
      border: 2px solid rgba(255, 255, 255, 0.35);
      color: #fff;
      font-size: 1.6rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }
    .touch-btn:active {
      background: rgba(16, 185, 129, 0.5);
      transform: scale(0.92);
    }
    .hud {
      position: absolute;
      top: 1rem;
      left: 1rem;
      right: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 800;
      font-size: 1rem;
      text-shadow: 0 2px 4px rgba(0,0,0,0.6);
      z-index: 10;
    }
    .hud-badge {
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(4px);
      padding: 0.35rem 0.8rem;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.15);
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }
    /* Game Over / Start Overlay */
    .overlay-screen {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(6px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.2rem;
      padding: 2rem;
      text-align: center;
      z-index: 20;
    }
    .overlay-screen h1 {
      font-size: 2rem;
      font-weight: 900;
      color: #fbbf24;
      text-shadow: 0 3px 10px rgba(251, 191, 36, 0.4);
    }
    .play-btn {
      background: linear-gradient(135deg, #10b981, #059669);
      border: none;
      color: #fff;
      padding: 0.85rem 2.2rem;
      border-radius: 30px;
      font-size: 1.15rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(16, 185, 129, 0.5);
      transition: transform 0.1s ease;
    }
    .play-btn:active { transform: scale(0.95); }
  </style>
</head>
<body>

  <div id="game-wrapper">
    <!-- Heads-Up Display -->
    <div class="hud">
      <div class="hud-badge">🍌 <span id="scoreVal">0</span></div>
      <div class="hud-badge">🏆 En Yüksek: <span id="highScoreVal">0</span></div>
    </div>

    <!-- Main Game Canvas -->
    <canvas id="gameCanvas"></canvas>

    <!-- Touch Navigation for Mobile -->
    <div class="touch-controls">
      <div class="touch-btn" id="btnLeft">◀</div>
      <div class="touch-btn" id="btnRight">▶</div>
    </div>

    <!-- Start / Game Over Modal -->
    <div class="overlay-screen" id="overlay">
      <div style="font-size: 4rem;">🐵</div>
      <h1 id="overlayTitle">Zıplayan Maymun</h1>
      <p id="overlayDesc" style="color: #cbd5e1; font-size: 0.95rem; line-height: 1.4;">
        Platformlardan zıplayarak yukarı tırman, muzları topla ve aşağı düşme!
      </p>
      <button class="play-btn" id="playBtn" onclick="startGame()">OYNA</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const wrapper = document.getElementById('game-wrapper');

    let width, height;
    function resizeCanvas() {
      width = wrapper.clientWidth;
      height = wrapper.clientHeight;
      canvas.width = width;
      canvas.height = height;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Game Variables
    let gameState = "START"; // START, PLAYING, GAMEOVER
    let score = 0;
    let highScore = localStorage.getItem('monkey_high_score') || 0;
    document.getElementById('highScoreVal').innerText = highScore;

    // Monkey Character
    const monkey = {
      x: width / 2 - 20,
      y: height - 120,
      w: 36,
      h: 42,
      vx: 0,
      vy: -12,
      speed: 6.5,
      gravity: 0.38,
      jumpStrength: -11.5,
      facingRight: true
    };

    // Platforms & Bananas
    let platforms = [];
    let bananas = [];
    const PLATFORM_COUNT = 7;

    function initPlatforms() {
      platforms = [];
      bananas = [];
      // Starting base platform
      platforms.push({ x: width / 2 - 50, y: height - 40, w: 100, h: 14, type: 'normal' });

      for (let i = 1; i < PLATFORM_COUNT; i++) {
        const py = height - (i * (height / PLATFORM_COUNT));
        const px = Math.random() * (width - 80);
        const pType = Math.random() < 0.2 ? 'spring' : 'normal';
        platforms.push({ x: px, y: py, w: 75, h: 14, type: pType });

        // Spawn banana occasionally
        if (Math.random() < 0.45) {
          bananas.push({ x: px + 28, y: py - 26, w: 18, h: 18, collected: false });
        }
      }
    }

    // Input handlers
    const keys = { left: false, right: false };

    window.addEventListener('keydown', e => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
    });
    window.addEventListener('keyup', e => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
    });

    // Touch Controls
    const btnLeft = document.getElementById('btnLeft');
    const btnRight = document.getElementById('btnRight');

    btnLeft.addEventListener('touchstart', e => { e.preventDefault(); keys.left = true; });
    btnLeft.addEventListener('touchend', e => { e.preventDefault(); keys.left = false; });
    btnRight.addEventListener('touchstart', e => { e.preventDefault(); keys.right = true; });
    btnRight.addEventListener('touchend', e => { e.preventDefault(); keys.right = false; });

    // Touch / Tilt fallback: tap canvas on left/right half
    canvas.addEventListener('touchstart', e => {
      const touchX = e.touches[0].clientX - wrapper.getBoundingClientRect().left;
      if (touchX < width / 2) keys.left = true;
      else keys.right = true;
    });
    canvas.addEventListener('touchend', () => {
      keys.left = false;
      keys.right = false;
    });

    function startGame() {
      document.getElementById('overlay').style.display = 'none';
      score = 0;
      document.getElementById('scoreVal').innerText = score;
      monkey.x = width / 2 - 18;
      monkey.y = height - 120;
      monkey.vx = 0;
      monkey.vy = -12;
      initPlatforms();
      gameState = "PLAYING";
    }

    function gameOver() {
      gameState = "GAMEOVER";
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('monkey_high_score', highScore);
        document.getElementById('highScoreVal').innerText = highScore;
      }
      document.getElementById('overlayTitle').innerText = "Oyun Bitti!";
      document.getElementById('overlayDesc').innerHTML = `Maymun düştü! 🍌 <strong>Skorun: ${score}</strong><br>En Yüksek Skor: ${highScore}`;
      document.getElementById('playBtn').innerText = "TEKRAR DENE";
      document.getElementById('overlay').style.display = 'flex';
    }

    // Main Game Loop
    function update() {
      if (gameState !== "PLAYING") return;

      // Horizontal movement
      if (keys.left) {
        monkey.vx = -monkey.speed;
        monkey.facingRight = false;
      } else if (keys.right) {
        monkey.vx = monkey.speed;
        monkey.facingRight = true;
      } else {
        monkey.vx *= 0.82;
      }

      monkey.x += monkey.vx;
      // Screen wrap
      if (monkey.x < -monkey.w) monkey.x = width;
      if (monkey.x > width) monkey.x = -monkey.w;

      // Vertical movement & gravity
      monkey.vy += monkey.gravity;
      monkey.y += monkey.vy;

      // Camera scroll when monkey climbs above mid screen
      if (monkey.y < height * 0.42 && monkey.vy < 0) {
        const diff = (height * 0.42) - monkey.y;
        monkey.y = height * 0.42;
        score += Math.floor(diff / 5);
        document.getElementById('scoreVal').innerText = score;

        // Shift platforms and bananas down
        platforms.forEach(p => {
          p.y += diff;
          if (p.y > height) {
            p.y = 0;
            p.x = Math.random() * (width - 75);
            p.type = Math.random() < 0.2 ? 'spring' : 'normal';
          }
        });

        bananas.forEach(b => {
          b.y += diff;
          if (b.y > height) {
            b.y = -30;
            b.x = Math.random() * (width - 30);
            b.collected = false;
          }
        });
      }

      // Platform Collisions (only when falling)
      if (monkey.vy > 0) {
        platforms.forEach(p => {
          if (
            monkey.x + monkey.w * 0.7 > p.x &&
            monkey.x + monkey.w * 0.3 < p.x + p.w &&
            monkey.y + monkey.h >= p.y &&
            monkey.y + monkey.h <= p.y + p.h + 10
          ) {
            if (p.type === 'spring') {
              monkey.vy = monkey.jumpStrength * 1.5; // Super jump!
            } else {
              monkey.vy = monkey.jumpStrength;
            }
          }
        });
      }

      // Banana Collection
      bananas.forEach(b => {
        if (!b.collected &&
            monkey.x < b.x + b.w &&
            monkey.x + monkey.w > b.x &&
            monkey.y < b.y + b.h &&
            monkey.y + monkey.h > b.y) {
          b.collected = true;
          score += 50;
          document.getElementById('scoreVal').innerText = score;
        }
      });

      // Bottom death check
      if (monkey.y > height) {
        gameOver();
      }
    }

    function render() {
      ctx.clearRect(0, 0, width, height);

      // Draw Platforms
      platforms.forEach(p => {
        if (p.type === 'spring') {
          ctx.fillStyle = '#f59e0b'; // Amber spring platform
        } else {
          ctx.fillStyle = '#10b981'; // Emerald vine platform
        }
        ctx.beginPath();
        ctx.roundRect(p.x, p.y, p.w, p.h, 6);
        ctx.fill();

        // Platform top highlight
        ctx.fillStyle = p.type === 'spring' ? '#fde68a' : '#6ee7b7';
        ctx.fillRect(p.x + 4, p.y + 2, p.w - 8, 3);
      });

      // Draw Bananas
      bananas.forEach(b => {
        if (!b.collected) {
          ctx.font = "20px sans-serif";
          ctx.fillText("🍌", b.x, b.y + 16);
        }
      });

      // Draw Monkey
      ctx.save();
      ctx.translate(monkey.x + monkey.w / 2, monkey.y + monkey.h / 2);
      if (!monkey.facingRight) ctx.scale(-1, 1);
      ctx.font = "34px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("🐒", 0, 0);
      ctx.restore();
    }

    function loop() {
      update();
      render();
      requestAnimationFrame(loop);
    }
    initPlatforms();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
